app-id: io.github.roethlar.songr
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: songr
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  # No D-Bus session access, deliberately: the Flatpak ships WITHOUT a tray
  # icon. Owner ruling 2026-08-22 — the tray is not a wanted feature.
  #
  # Do not "restore" this as a bug. Measured on KDE Plasma 2026-08-21, every
  # finish-args configuration that produces a working tray is a
  # flatpak-builder-lint ERROR (an --own-name of either StatusNotifierItem
  # spelling, or --socket=session-bus), while --talk-name alone lints clean and
  # registers nothing, because Electron does not fall back to its unique bus
  # name. Granting nothing keeps the submission lint-clean and needs no Flathub
  # exception.
  #
  # Closing the window hides rather than quits, but nothing is stranded:
  # relaunching from the desktop entry takes the single-instance path, which
  # calls focusExistingWindow() -> show() and brings the window back.
modules:
  - name: songr
    buildsystem: simple
    build-commands:
      - chmod +x Songr-@VERSION@.AppImage
      - ./Songr-@VERSION@.AppImage --appimage-extract
      - rm -f Songr-@VERSION@.AppImage
      - rm -rf /app/songr.AppDir
      - mv squashfs-root /app/songr.AppDir
      - install -Dm755 songr.sh /app/bin/songr
      - install -Dm644 io.github.roethlar.songr.desktop /app/share/applications/io.github.roethlar.songr.desktop
      - install -Dm644 io.github.roethlar.songr.metainfo.xml /app/share/metainfo/io.github.roethlar.songr.metainfo.xml
      - install -Dm644 io.github.roethlar.songr.png /app/share/icons/hicolor/512x512/apps/io.github.roethlar.songr.png
    sources:
      - type: file
        url: https://github.com/roethlar/songr/releases/download/v@VERSION@/Songr-@VERSION@.AppImage
        sha256: '@SHA256_APPIMAGE_X64@'
        dest-filename: Songr-@VERSION@.AppImage
        x-checker-data:
          type: json
          url: https://api.github.com/repos/roethlar/songr/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name == "Songr-" + $version + ".AppImage") | .browser_download_url
      - type: file
        path: songr.sh
      - type: file
        path: io.github.roethlar.songr.desktop
      - type: file
        path: io.github.roethlar.songr.metainfo.xml
      - type: file
        path: io.github.roethlar.songr.png
