<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Starting</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: #101014;
        color: #e6e6ea;
        font: 400 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      .spinner {
        width: 34px;
        height: 34px;
        border: 3px solid rgba(230, 230, 234, 0.18);
        border-top-color: rgba(230, 230, 234, 0.85);
        border-radius: 50%;
        animation: spin 900ms linear infinite;
      }
      p {
        margin: 0;
        color: #a5a5b0;
        letter-spacing: 0.01em;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 3s;
        }
      }
    </style>
  </head>
  <body>
    <div class="spinner" role="presentation"></div>
    <p>Starting&#8230;</p>
  </body>
</html>
