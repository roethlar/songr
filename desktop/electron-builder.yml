# electron-builder configuration for the desktop shell.
#
# Read `scripts/package-app.mjs` beside this file: the engine payload named
# below under `extraResources` does not exist until that script stages it, so
# running `electron-builder` directly produces an app that cannot start. The
# script is the entry point; this file is the part electron-builder reads.
#
# All checkouts use the published identity. Signing follows the credential-
# gated release workflow and local keychain configuration below.
appId: app.songr.desktop
productName: Songr
copyright: Songr contributors

# The public runtime identity, written into the packaged app's own
# package.json. This is the half the pulled v1.1.4 build lacked: productName
# above names the bundle and artifacts, but Electron derives userData — and
# the single-instance lock — from this manifest. The shared packaging module
# supplies the same identity on every build.
extraMetadata:
  name: songr
  productName: Songr

directories:
  output: release/artifacts

# The shell is small and pure JavaScript; archiving it costs nothing and keeps
# the app directory tidy. The engine is emphatically NOT in here — see
# extraResources.
asar: true

# There is no native module anywhere in this workspace (socket.io-client is
# pure JavaScript), so a rebuild step would download a toolchain to do nothing.
# Turning it off also removes the last source of run-to-run variation.
npmRebuild: false

files:
  - dist/**/*
  - resources/**/*
  - package.json

# The engine: the repository's compiled backend, its built UI and a
# production-only node_modules, staged by `scripts/package-app.mjs`. It has to
# live outside the asar because the shell forks it as a plain Node program, and
# Node cannot require its way into an asar archive.
#
# The copy root is the payload's PARENT, and that is not cosmetic.
# app-builder-lib refuses any directory whose path relative to the copy root is
# exactly `node_modules`, before it consults a single filter pattern. Copying
# from the parent leaves the engine's dependencies at `engine/node_modules`,
# which the rule does not match. Naming the payload directly here builds an app
# that installs cleanly and then cannot require express.
extraResources:
  - from: release/payload
    filter:
      - '**/*'

mac:
  target:
    - dmg
  category: public.app-category.music
  # A single 1024px PNG; electron-builder converts it to icns/ico/png sets
  # per target. Rendered deterministically from build/icon.svg (the wordmark's
  # own sol-rune geometry) by scripts/render-icons.mjs — never hand-exported.
  icon: build/icon.png
  # Signing follows electron-builder's defaults: a Developer ID identity in
  # the local keychain signs every build (owner requirement, 2026-08-07 —
  # local builds are signed every time), CI provides the cert via
  # CSC_LINK/CSC_KEY_PASSWORD and adds --config.mac.notarize=true alongside
  # the Apple ID credentials, and secretless CI passes
  # --config.mac.identity=null to stay explicitly unsigned. Hardened runtime
  # is required for notarization and harmless without signing.
  hardenedRuntime: true

dmg:
  writeUpdateInfo: false

linux:
  target:
    - AppImage
    - deb
    - rpm
  category: AudioVideo
  # An icon SET directory, not a single PNG. Pointed at `build/icon.png`,
  # electron-builder installed that file as-is at its native size, so deb/rpm
  # shipped only `hicolor/1024x1024/apps/songr.png` — a directory
  # `hicolor-icon-theme`'s index.theme does not list, and freedesktop icon
  # lookup visits only listed directories. `Icon=songr` therefore resolved to
  # nothing and launchers drew a blank. `build/icons/` holds 16 through 512,
  # all listed sizes, rendered by `scripts/render-icons.mjs`. mac and win stay
  # on the 1024 PNG, which is the source their icns/ico conversion wants.
  icon: build/icons
  # The package name, the binary on `$PATH`, and (via syncDesktopName) the
  # `.desktop` file and WM_CLASS. Without it every Linux artifact would be named
  # after the npm workspace, `roon-controller-desktop`, and the window manager
  # would not associate the running window with its launcher entry.
  executableName: songr
  syncDesktopName: true
  # deb and rpm both require a maintainer field. This is not a support address:
  # `.invalid` is the reserved never-resolvable TLD (RFC 2606), and it is the
  # same identity the release pipeline already uses for the public commit
  # author, so the two do not drift.
  maintainer: Songr <release@songr.invalid>
  synopsis: Multi platform controller for your Roon Core
  description: >
    Multi platform controller for your Roon Core. Linux, macOS, Windows, or
    browser, your library is at your fingertips.

# deb and rpm take their package name from package.json's `name`, which is the
# npm workspace name and not a product name. Stating it here keeps the
# installed package `songr` without renaming the workspace — a rename would
# also move the per-user data directory a dev run writes to, for no gain.
deb:
  packageName: songr
  artifactName: songr_${version}_${arch}.${ext}

rpm:
  packageName: songr
  artifactName: songr-${version}.${arch}.${ext}

win:
  target:
    - nsis
  icon: build/icon.png

nsis:
  # A per-user install with a visible directory choice, because the artifact is
  # unsigned: a one-click per-machine installer would raise a UAC prompt for an
  # unsigned binary, which is the worst of both worlds.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
