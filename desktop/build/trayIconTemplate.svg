<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-label="Songr">
  <title>Songr tray template</title>
  <!-- The sol rune as a macOS template image: pure black plus alpha, so the
       system recolours it for light/dark menu bars. Same wordmark geometry as
       the app icon, scaled to a 16pt box. -->
  <g transform="translate(4.55, 1.1) scale(0.1428)"
     fill="none" stroke="#000000" stroke-width="9"
     stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M12 2 L12 56 L36 34 L36 100" />
  </g>
</svg>
