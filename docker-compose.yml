services:
  roon-controller:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Stamp the UI with the real revision (the build stage has no
        # .git). Compose reads this from the shell environment:
        #   SOURCE_COMMIT=$(git rev-parse --short HEAD) docker compose build
        # Unset, the build falls back to a unique per-build stamp.
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    image: ghcr.io/roethlar/songr:latest
    restart: unless-stopped
    env_file:
      # Optional overrides — every variable has a working default baked into
      # the image. Copy .env.example to .env only if you want to change one.
      # (Needs Compose v2.24+; on older versions create .env first.)
      - path: .env
        required: false
    # Host networking lets the container discover a Roon Core on the local
    # network. With ROON_CORE_HOST set, you can also use a bridge network
    # with a route to the Core and publish the app's HTTP port (default 3333).
    # NOTE: network_mode: host is a no-op on Docker Desktop for
    # macOS/Windows without its "host networking" feature enabled —
    # run natively there, or enable that feature.
    network_mode: host
    volumes:
      - ./config:/app/config
      - ./data:/app/data
