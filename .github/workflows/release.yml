# Builds every desktop artifact when a release tag is pushed, and attaches
# them to the GitHub release for that tag.
#
# One job per operating system; each runs the repository's own deterministic
# packaging script (desktop/scripts/package-app.mjs), which builds the server,
# the web UI, and the shell, stages the engine payload, and invokes
# electron-builder. Everything after `--` is handed to electron-builder, which
# is how one runner produces both architectures. Signing is secrets-gated per
# platform — mac via a Developer ID cert (CSC_LINK) + notarization, windows
# via Azure Trusted Signing — and each falls back to an unsigned build when
# its secrets are absent; the README documents the unsigned first-launch
# steps each platform then needs.
name: release-assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      # One platform failing must not cancel the others' uploads.
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-14
            target: '--mac'
            # dmg for Apple Silicon and Intel from one arm64 runner.
            arches: '--arm64 --x64'
          - name: linux
            os: ubuntu-latest
            # The linux job also wraps the platform-independent server
            # payload (pure-JS dependencies) as a tar.gz for people who
            # want the server without the desktop app or a source build.
            target: '--linux --server-tar'
            # AppImage, deb and rpm for both architectures.
            arches: '--arm64 --x64'
          - name: windows
            os: windows-latest
            target: '--win'
            arches: '--x64'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # One shell everywhere: the `--` argument layering below must reach
        # npm identically on all three platforms, and pwsh handles `--`
        # differently.
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
            desktop/package-lock.json

      - name: Install rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix ui
          npm ci --prefix desktop

      - name: Build and package
        # macOS signing + notarization activate automatically when the repo
        # carries the secrets; without them the build is unsigned, exactly as
        # local builds are. MAC_CERT_P12 is a base64 Developer ID Application
        # certificate export; APPLE_APP_SPECIFIC_PASSWORD comes from
        # appleid.apple.com for the notarization submission.
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Azure Trusted Signing for the windows exe. The three AZURE_*
          # credentials are read by the TrustedSigning module's
          # EnvironmentCredential; endpoint/account/profile ride secrets too
          # so the public tree names no Azure resources.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: |
          # A missing repo secret renders as an EMPTY-BUT-DEFINED env var, and
          # electron-builder treats any defined CSC_LINK as a signing request
          # ("empty password will be used for code signing", then failure —
          # the first icon-release mac job died exactly there). Drop empties,
          # and make the secretless path explicitly unsigned.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID \
                   AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET \
                   AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_CERT_PROFILE; do
            if [ -z "$(printenv "$v")" ]; then unset "$v"; fi
          done
          EXTRA=""
          if [ "${{ runner.os }}" = "macOS" ]; then
            if [ -n "${CSC_LINK:-}" ]; then
              EXTRA="--config.mac.notarize=true"
            else
              EXTRA="--config.mac.identity=null"
            fi
          fi
          # Windows signing does NOT go through electron-builder's own
          # win.azureSignOptions: that path calls into Azure's dlib/signtool
          # integration internally and failed with a generic SignerSign()
          # E_FAIL (-2147467259) on the first signed run, past config
          # validation. The manual Invoke-TrustedSigning module — the same
          # call this owner's other four apps all sign with successfully
          # today — is used instead, as a step after packaging. The Windows
          # build itself always runs unsigned here.
          npm --prefix desktop run package -- ${{ matrix.target }} -- ${{ matrix.arches }} $EXTRA
          echo "SIGNING_EXTRA=$EXTRA" >> "$GITHUB_ENV"
          # `secrets` is not a recognized named-value inside a step `if:`
          # expression (GitHub Actions rejected it outright, both signing
          # steps below failing to parse at all) -- routing presence
          # through GITHUB_ENV, same as SIGNING_EXTRA already does.
          if [ -n "${AZURE_CLIENT_SECRET:-}" ] && [ -n "${AZURE_SIGNING_ENDPOINT:-}" ] \
             && [ -n "${AZURE_SIGNING_ACCOUNT:-}" ] && [ -n "${AZURE_CERT_PROFILE:-}" ]; then
            echo "AZURE_SIGNING_ENABLED=true" >> "$GITHUB_ENV"
          fi

      - name: Sign Windows executable
        if: runner.os == 'Windows' && env.AZURE_SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: |
          try {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          } catch {
            Write-Host "NuGet provider not installed here: $($_.Exception.Message)"
          }
          Install-Module -Name TrustedSigning -MinimumVersion 0.5.0 -Force -Repository PSGallery -Scope CurrentUser
          $exe = Get-ChildItem -Path desktop/release/artifacts -Filter '*.exe' -File | Select-Object -First 1
          if (-not $exe) { throw "no .exe artifact found to sign" }
          Invoke-TrustedSigning `
            -Endpoint $env:AZURE_SIGNING_ENDPOINT `
            -CodeSigningAccountName $env:AZURE_SIGNING_ACCOUNT `
            -CertificateProfileName $env:AZURE_CERT_PROFILE `
            -TimestampRfc3161 'http://timestamp.acs.microsoft.com' `
            -TimestampDigest SHA256 `
            -FileDigest SHA256 `
            -Files $exe.FullName

      - name: Notarize and staple macOS DMG
        # electron-builder's mac.notarize:true notarizes and staples the
        # .app, but never submits the dmg wrapping it — the first signed run
        # proved this: stapler staple on the dmg failed with "Record not
        # found" (CloudKit had no ticket for its hash at all, not merely an
        # unfetched one). Submitting the dmg itself, same account-based
        # notarytool auth electron-builder already used for the .app.
        #
        # electron-builder's dmg.sign defaults false (its own docs warn
        # signing "will lead to unwanted errors in combination with
        # notarization requirements"), which is fine for stapler validate,
        # but spctl --type open --context context:primary-signature demands
        # an actual primary signature on the file being assessed — the
        # second signed run proved this too: staple succeeded, spctl still
        # rejected with "no usable signature". ChickenScratch's tauri-built
        # dmg passes the identical spctl check because tauri signs its dmg
        # container; electron-builder does not, so this step signs the dmg
        # itself before submitting it, going around that default.
        if: runner.os == 'macOS' && env.SIGNING_EXTRA == '--config.mac.notarize=true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg=$(find desktop/release/artifacts -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"
          identity=$(security find-identity -v -p codesigning | grep -o '"Developer ID Application:[^"]*"' | head -1 | tr -d '"')
          test -n "$identity"
          codesign --sign "$identity" --timestamp "$dmg"
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait 2>&1 | tee /tmp/notarytool.txt
          grep -qE '^[[:space:]]*status: Accepted$' /tmp/notarytool.txt
          xcrun stapler staple "$dmg"

      - name: Verify Windows signature
        # A signing step can silently no-op and still exit 0 — electron-builder's
        # CSC_IDENTITY_AUTO_DISCOVERY can grab an incidental identity and log
        # "signing with signtool.exe" even when no azureSignOptions flags were
        # ever passed (this happened for real: the v1.1.2 release shipped an
        # exe electron-builder logged as signed, with no verification to catch
        # that it was never actually Azure Trusted Signing). Only assert when
        # this run's own gate actually injected the Azure flags.
        if: runner.os == 'Windows' && env.AZURE_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path desktop/release/artifacts -Filter '*.exe' -File | Select-Object -First 1
          if (-not $exe) { throw "no .exe artifact found to verify" }
          $signature = Get-AuthenticodeSignature -LiteralPath $exe.FullName
          $signature | Format-List * | Out-String | Write-Output
          if ($signature.Status -ne 'Valid') {
            throw "$($exe.Name) signature status is $($signature.Status), expected Valid"
          }

      - name: Verify macOS signature and notarization
        # Same rationale as the Windows check above: assert, don't trust a
        # green build. Only when this run's own gate actually signed (mac.
        # identity=null means an intentionally unsigned build).
        #
        # The DMG container itself is never code-signed here — electron-builder's
        # own schema documents dmg.sign as "will lead to unwanted errors in
        # combination with notarization requirements" and defaults it false, so
        # the app inside carries the Developer ID signature and the dmg carries
        # the stapled notarization ticket instead. codesign --verify therefore
        # runs against the .app in the unpacked build dir, not the dmg; the dmg
        # itself is checked via stapler + spctl (Gatekeeper's own acceptance
        # test), matching ChickenScratch's proven macos-release.yml pattern.
        if: runner.os == 'macOS' && !contains(env.SIGNING_EXTRA, 'identity=null')
        run: |
          dmg=$(find desktop/release/artifacts -maxdepth 1 -name '*.dmg' -print -quit)
          app=$(find desktop/release/artifacts -maxdepth 2 -name '*.app' -print -quit)
          test -n "$dmg"
          test -n "$app"
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | tee /tmp/codesign.txt
          grep -q 'Authority=Developer ID Application' /tmp/codesign.txt
          # The "Notarize and staple macOS DMG" step above already stapled
          # the dmg's own ticket (electron-builder's notarize:true covers
          # only the .app, confirmed by the first run's CloudKit "Record not
          # found" when this step tried to staple without that prior step).
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"

      - name: Attach artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/artifacts/*.dmg
            desktop/release/artifacts/*.AppImage
            desktop/release/artifacts/*.deb
            desktop/release/artifacts/*.rpm
            desktop/release/artifacts/*.exe
            desktop/release/artifacts/*.tar.gz

  # Each architecture builds on ITS OWN native runner and pushes by digest;
  # a merge job assembles the multi-arch manifest. QEMU emulation is not
  # used: Node under qemu dies with SIGILL (exit 132) often enough that the
  # v1.1.1 arm64 leg failed twice in a row.
  docker:
    name: docker (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            os: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: docker-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: docker manifest
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: docker-digest-*
          merge-multiple: true

      - name: Create the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}:${{ github.ref_name }} \
            -t ghcr.io/${{ github.repository }}:latest \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
