# Builds every desktop artifact when a release tag is pushed, and attaches
# them to the GitHub release for that tag.
#
# One job per operating system; each runs the repository's own deterministic
# packaging script (desktop/scripts/package-app.mjs), which builds the server,
# the web UI, and the shell, stages the engine payload, and invokes
# electron-builder. Everything after `--` is handed to electron-builder, which
# is how one runner produces both architectures. Canonical release signing is
# required: macOS uses Developer ID and notarization; Windows uses Azure Trusted Signing. Missing credentials or
# failed verification stop artifact publication.
name: release-assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: ${{ matrix.name }}
    if: github.repository == 'roethlar/songr'
    strategy:
      # One platform failing must not cancel the others' uploads.
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-14
            target: '--mac'
            # dmg for Apple Silicon and Intel from one arm64 runner.
            arches: '--arm64 --x64'
          - name: linux
            os: ubuntu-latest
            # The linux job also wraps the platform-independent server
            # payload (pure-JS dependencies) as a tar.gz for people who
            # want the server without the desktop app or a source build.
            target: '--linux --server-tar'
            # AppImage, deb and rpm for both architectures.
            arches: '--arm64 --x64'
          - name: windows
            os: windows-latest
            target: '--win'
            arches: '--x64'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # One shell everywhere: the `--` argument layering below must reach
        # npm identically on all three platforms, and pwsh handles `--`
        # differently.
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
            desktop/package-lock.json

      - name: Install rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix ui
          npm ci --prefix desktop

      - name: Import Developer ID certificate
        # electron-builder imports CSC_LINK into its OWN temporary keychain
        # for the duration of its internal sign+notarize calls, then tears
        # it down — the "Notarize and staple macOS DMG" step (which signs
        # the dmg itself, separately) found no identity at all when it tried
        # security find-identity afterward, on the second signed run. A
        # persistent keychain, imported the same way ChickenScratch/blit/
        # AMKB already do, keeps the identity available for the rest of
        # this job regardless of what electron-builder does with its own.
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          # A release must stop before building when its identity is unavailable.
          if [ -z "$MAC_CERT_P12" ]; then
            echo "::error::MAC_CERT_P12 is required for a macOS release"
            exit 1
          fi
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/songr-signing.keychain-db"
          printf '%s' "$MAC_CERT_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$MAC_CERT_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$MAC_CERT_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MAC_CERT_PASSWORD" "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application:[^"]*"' | head -1 | tr -d '"')
          test -n "$identity"
          echo "MAC_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          rm -f "$certificate"

      - name: Build and package
        # macOS signs and notarizes during packaging. Windows is signed below
        # with TrustedSigning, then verified before any installer is uploaded.
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Azure Trusted Signing for the windows exe. The three AZURE_*
          # credentials are read by the TrustedSigning module's
          # EnvironmentCredential; endpoint/account/profile ride secrets too
          # so the public tree names no Azure resources.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            macOS)
              required="CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID"
              ;;
            Windows)
              required="AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_CERT_PROFILE"
              ;;
            *) required="" ;;
          esac
          for name in $required; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::$name is required for a signed ${{ runner.os }} release"
              exit 1
            fi
          done
          # Drop unrelated empty credentials so Linux packaging does not treat
          # an empty CSC_LINK as a request to import a signing identity.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID \
                   AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET \
                   AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_CERT_PROFILE; do
            if [ -z "$(printenv "$v")" ]; then unset "$v"; fi
          done
          EXTRA=""
          if [ "${{ runner.os }}" = "macOS" ]; then
            EXTRA="--config.mac.notarize=true --config.forceCodeSigning=true"
          fi
          # Windows signing does NOT go through electron-builder's own
          # win.azureSignOptions: that path calls into Azure's dlib/signtool
          # integration internally and failed with a generic SignerSign()
          # E_FAIL (-2147467259) on the first signed run, past config
          # validation. The manual Invoke-TrustedSigning module — the same
          # call this owner's other four apps all sign with successfully
          # today — is used instead, as a step after packaging. The Windows
          # build itself always runs unsigned here.
          npm --prefix desktop run package -- ${{ matrix.target }} -- ${{ matrix.arches }} $EXTRA

      - name: Sign Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: |
          try {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          } catch {
            Write-Host "NuGet provider not installed here: $($_.Exception.Message)"
          }
          Install-Module -Name TrustedSigning -MinimumVersion 0.5.0 -Force -Repository PSGallery -Scope CurrentUser
          $exe = Get-ChildItem -Path desktop/release/artifacts -Filter '*.exe' -File | Select-Object -First 1
          if (-not $exe) { throw "no .exe artifact found to sign" }
          Invoke-TrustedSigning `
            -Endpoint $env:AZURE_SIGNING_ENDPOINT `
            -CodeSigningAccountName $env:AZURE_SIGNING_ACCOUNT `
            -CertificateProfileName $env:AZURE_CERT_PROFILE `
            -TimestampRfc3161 'http://timestamp.acs.microsoft.com' `
            -TimestampDigest SHA256 `
            -FileDigest SHA256 `
            -Files $exe.FullName

      - name: Notarize and staple macOS DMG
        # electron-builder's mac.notarize:true notarizes and staples the
        # .app, but never submits the dmg wrapping it — the first signed run
        # proved this: stapler staple on the dmg failed with "Record not
        # found" (CloudKit had no ticket for its hash at all, not merely an
        # unfetched one). Submitting the dmg itself, same account-based
        # notarytool auth electron-builder already used for the .app.
        #
        # electron-builder's dmg.sign defaults false (its own docs warn
        # signing "will lead to unwanted errors in combination with
        # notarization requirements"), which is fine for stapler validate,
        # but spctl --type open --context context:primary-signature demands
        # an actual primary signature on the file being assessed — the
        # second signed run proved this too: staple succeeded, spctl still
        # rejected with "no usable signature". ChickenScratch's tauri-built
        # dmg passes the identical spctl check because tauri signs its dmg
        # container; electron-builder does not, so this step signs the dmg
        # itself before submitting it, going around that default.
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./desktop/package.json').version")
          test -n "$MAC_SIGNING_IDENTITY"
          for arch in arm64 x64; do
            if [ "$arch" = arm64 ]; then
              dmg="desktop/release/artifacts/Songr-${version}-arm64.dmg"
            else
              dmg="desktop/release/artifacts/Songr-${version}.dmg"
            fi
            test -f "$dmg"
            codesign --sign "$MAC_SIGNING_IDENTITY" --timestamp "$dmg"
            notary_log="$RUNNER_TEMP/songr-notary-${arch}.txt"
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --wait 2>&1 | tee "$notary_log"
            grep -qE '^[[:space:]]*status: Accepted$' "$notary_log"
            xcrun stapler staple "$dmg"
          done

      - name: Verify Windows signature
        # A signing step can silently no-op and still exit 0 — electron-builder's
        # CSC_IDENTITY_AUTO_DISCOVERY can grab an incidental identity and log
        # "signing with signtool.exe" even when no azureSignOptions flags were
        # ever passed (this happened for real: the v1.1.2 release shipped an
        # exe electron-builder logged as signed, with no verification to catch
        # that it was never actually Azure Trusted Signing). Every Windows
        # release must pass this check before upload.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path desktop/release/artifacts -Filter '*.exe' -File | Select-Object -First 1
          if (-not $exe) { throw "no .exe artifact found to verify" }
          $signature = Get-AuthenticodeSignature -LiteralPath $exe.FullName
          $signature | Format-List * | Out-String | Write-Output
          if ($signature.Status -ne 'Valid') {
            throw "$($exe.Name) signature status is $($signature.Status), expected Valid"
          }

      - name: Verify macOS signature and notarization
        # Assert both architectures, not the first file returned by find.
        # electron-builder signs/notarizes each .app; the preceding step signs,
        # notarizes and staples each wrapping DMG. Reject a missing architecture
        # or a mislabeled executable before attaching either release asset.
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          version=$(node -p "require('./desktop/package.json').version")
          for arch in arm64 x64; do
            if [ "$arch" = arm64 ]; then
              app="desktop/release/artifacts/mac-arm64/Songr.app"
              dmg="desktop/release/artifacts/Songr-${version}-arm64.dmg"
              binary_arch=arm64
            else
              app="desktop/release/artifacts/mac/Songr.app"
              dmg="desktop/release/artifacts/Songr-${version}.dmg"
              binary_arch=x86_64
            fi
            test -d "$app"
            test -f "$dmg"
            test "$(lipo -archs "$app/Contents/MacOS/Songr")" = "$binary_arch"
            codesign --verify --deep --strict "$app"
            signature_log="$RUNNER_TEMP/songr-codesign-${arch}.txt"
            codesign -dv --verbose=4 "$app" 2>&1 | tee "$signature_log"
            grep -q 'Authority=Developer ID Application' "$signature_log"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
            codesign --verify --strict "$dmg"
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          done

      - name: Attach artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/artifacts/*.dmg
            desktop/release/artifacts/*.AppImage
            desktop/release/artifacts/*.deb
            desktop/release/artifacts/*.rpm
            desktop/release/artifacts/*.exe
            desktop/release/artifacts/*.tar.gz

  # Publishes the package-manager manifests for this release.
  #
  # This runs as a job of THIS workflow with `needs: [build]`, deliberately, and
  # not as a separate workflow triggered by `on: release: published`. The
  # release object is created by softprops/action-gh-release using
  # GITHUB_TOKEN, and GitHub raises no workflow-triggering events from
  # GITHUB_TOKEN — a release-triggered workflow would simply never run.
  #
  # Package credentials are detected separately from required artifact signing.
  # A missing secret arrives as an empty but defined environment variable,
  # and `secrets` is not a recognized named-value inside a step `if:`, so
  # presence has to route through GITHUB_ENV rather than an `if:` expression.
  #
  # Package updates are restricted to the canonical public repository.
  publish-packages:
    name: publish to package managers
    needs: build
    if: github.repository == 'roethlar/songr'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Publish SHA256SUMS and render the manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo=roethlar/songr
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          # Checksums come from the release API's own server-computed digests,
          # so nothing is downloaded and nothing is hashed twice. SHA256SUMS
          # itself is excluded so re-running cannot fold it into its own list.
          gh release view "$tag" --repo "$repo" --json assets \
            --jq '.assets[] | select(.name != "SHA256SUMS") | "\(.digest | sub("sha256:";""))  \(.name)"' \
            | sort -k2 > SHA256SUMS
          test -s SHA256SUMS
          cat SHA256SUMS
          if gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].name' | grep -Fxq SHA256SUMS; then
            gh release download "$tag" --repo "$repo" --pattern SHA256SUMS --output existing-SHA256SUMS
            cmp SHA256SUMS existing-SHA256SUMS
          else
            gh release upload "$tag" SHA256SUMS --repo "$repo"
          fi
          date=$(gh release view "$tag" --repo "$repo" --json publishedAt --jq '.publishedAt[0:10]')
          node packaging/render.mjs --version "$version" --sums SHA256SUMS --date "$date" --check
          node packaging/render.mjs --version "$version" --sums SHA256SUMS --date "$date" --out rendered
          {
            echo "SONGR_VERSION=$version"
            echo "SONGR_TAG=$tag"
          } >> "$GITHUB_ENV"

      - name: Detect which publishing credentials exist
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          SCOOP_BUCKET_DEPLOY_KEY: ${{ secrets.SCOOP_BUCKET_DEPLOY_KEY }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for name in HOMEBREW_TAP_DEPLOY_KEY SCOOP_BUCKET_DEPLOY_KEY WINGET_TOKEN AUR_SSH_PRIVATE_KEY NPM_TOKEN; do
            if [ -n "$(printenv "$name")" ]; then
              echo "HAVE_${name}=true" >> "$GITHUB_ENV"
            else
              echo "::notice title=Skipping a package manager::$name is not set"
            fi
          done

      - name: Push the Homebrew cask
        if: env.HAVE_HOMEBREW_TAP_DEPLOY_KEY == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          ./packaging/push-repo.sh \
            --key "$DEPLOY_KEY" \
            --repo git@github.com:roethlar/homebrew-tap.git \
            --from rendered/homebrew \
            --message "songr ${SONGR_VERSION}"

      - name: Push the Scoop manifest
        if: env.HAVE_SCOOP_BUCKET_DEPLOY_KEY == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.SCOOP_BUCKET_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          ./packaging/push-repo.sh \
            --key "$DEPLOY_KEY" \
            --repo git@github.com:roethlar/scoop-bucket.git \
            --from rendered/scoop \
            --message "songr: update to ${SONGR_VERSION}"

      - name: Submit to WinGet
        if: env.HAVE_WINGET_TOKEN == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: roethlar.Songr
          version: ${{ env.SONGR_VERSION }}
          release-tag: ${{ env.SONGR_TAG }}
          installers-regex: '^Songr\.Setup\..*\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}

      - name: Publish to the AUR
        if: env.HAVE_AUR_SSH_PRIVATE_KEY == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: songr-bin
          pkgbuild: rendered/aur/PKGBUILD
          commit_username: Songr Release
          commit_email: release@songr.invalid
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: songr-bin ${{ env.SONGR_VERSION }}
          updpkgsums: false

      - name: Publish songr-server to npm
        # Unlike the other four targets, this one needs the actual built
        # payload inside the published tarball, not a manifest pointing at a
        # URL -- downloaded from THIS release's own songr-server asset
        # (produced by the linux job's --server-tar) rather than rebuilt, so
        # this job publishes exactly what was already tested and released.
        # See packaging/npm-server/README.md for why bundledDependencies is
        # required here (node-roon-api and friends are not on the public npm
        # registry) and what was proven about it empirically.
        if: env.HAVE_NPM_TOKEN == 'true'
        run: |
          set -euo pipefail
          if [ "$(npm view "songr-server@${SONGR_VERSION}" version 2>/dev/null)" = "${SONGR_VERSION}" ]; then
            echo "songr-server ${SONGR_VERSION} is already on npm; nothing to publish"
            exit 0
          fi

          gh release download "$SONGR_TAG" --repo roethlar/songr \
            --pattern "songr-server-*.tar.gz" --output songr-server.tar.gz
          mkdir -p server-payload
          tar -xzf songr-server.tar.gz -C server-payload --strip-components=1
          npm config set //registry.npmjs.org/:_authToken="${NPM_TOKEN}"
          node packaging/npm-server/patch-and-publish.mjs --dir "$(pwd)/server-payload"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Each architecture builds on ITS OWN native runner and pushes by digest;
  # a merge job assembles the multi-arch manifest. QEMU emulation is not
  # used: Node under qemu dies with SIGILL (exit 132) often enough that the
  # v1.1.1 arm64 leg failed twice in a row.
  docker:
    name: docker (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            os: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: docker-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: docker manifest
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: docker-digest-*
          merge-multiple: true

      - name: Create the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          images=()
          for digest in *; do
            images+=("ghcr.io/${{ github.repository }}@sha256:$digest")
          done
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}:${{ github.ref_name }} \
            -t ghcr.io/${{ github.repository }}:latest \
            "${images[@]}"
